<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN" "http://www.w3.org/TR/REC-html40/loose.dtd"> <html><body> <p><strong>Cancer Discovery</strong>：该研究提出仅用外周血发现新抗原并分离反应性T细胞的策略。血浆cfDNA全外显子组测序识别非同义突变，按PD-1/CD39共表达分选循环CD4+/CD8+ T细胞，经个性化TMG筛选验证。8例转移癌中检出多数新抗原及活检遗漏的ctDNA独有亚克隆新抗原；69例转移癌队列中约半数（32/69）适用血液-only路径，结直肠癌达82.4%。结果支持血液替代或补充肿瘤活检，拓展新抗原靶向治疗可及性。</p> <p><img src="/images/paper/cd-blood-neoantigen.webp" alt=""></p> <blockquote> <p>首发于小红书（2026-10-26）· <a href="https://www.xiaohongshu.com/explore/6adeca24000000001401aed4" rel="external nofollow noopener" target="_blank">查看原文</a></p> </blockquote> </body></html>
