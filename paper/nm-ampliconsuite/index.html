<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN" "http://www.w3.org/TR/REC-html40/loose.dtd"> <html><body> <p><strong>Nature Methods</strong>：该论文提出AmpliconSuite，一个基于全基因组测序（WGS）分析癌症局灶性扩增的端到端工作流。它整合AA与AC并新增ecContext模块，精准区分ecDNA的切除或染色体碎裂形成机制。在175个FISH验证基因中达0.91精确度和0.95召回率。团队构建了AmpliconRepository共享平台，并基于6506例泛癌样本揭示了ecDNA介导的癌基因共扩增偏好，为癌症基因组学提供了强大工具与数据资源。</p> <p><img src="/images/paper/nm-ampliconsuite.webp" alt=""></p> <blockquote> <p>首发于小红书（2026-10-19）· <a href="https://www.xiaohongshu.com/explore/6ad5c054000000002f0321f3" rel="external nofollow noopener" target="_blank">查看原文</a></p> </blockquote> </body></html>
