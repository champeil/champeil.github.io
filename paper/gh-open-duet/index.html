<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN" "http://www.w3.org/TR/REC-html40/loose.dtd"> <html><body> <p>开源自托管的 AI 同事工作区，Claude Duet 的开源平替：在自己的电脑或服务器上创建一组有名字、有分工的 AI 智能体，像管理团队一样长期协作。具名 agent 各有指令、模型、工作区、记忆与审批设置；主管分派、专才执行，也可多 agent 共享房间并行工作；审批闸门与 Docker 隔离环境兼顾自动化与安全；引擎中立，不绑定单一供应商。</p> <p><strong>仓库</strong>：<a href="https://github.com/Anil-matcha/open-duet" rel="external nofollow noopener" target="_blank">Anil-matcha/open-duet</a></p> <p><strong>来源</strong>：<a href="https://www.xiaohongshu.com/explore/6ae7ff8d00000000260026f2" rel="external nofollow noopener" target="_blank">小红书笔记</a>（2026-11-02）</p> </body></html>
